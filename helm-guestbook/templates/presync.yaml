apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: migration
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Running database migrations..."
              sleep 10
              echo "Database migrations completed successfully!"
      restartPolicy: Never
  backoffLimit: 1
